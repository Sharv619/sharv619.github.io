version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  pre_build:
    commands:
      - npm run lint
      - test ! -d tests || npm run test:run
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - test -f out/index.html
      - aws s3 sync out s3://sharv619-portfolio-site --delete --cache-control "public,max-age=3600"
      - test ! -d out/_next/static || aws s3 sync out/_next/static s3://sharv619-portfolio-site/_next/static --cache-control "public,max-age=31536000,immutable"

artifacts:
  base-directory: out
  files:
    - "**/*"

cache:
  paths:
    - "/root/.npm/**/*"
